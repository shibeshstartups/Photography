name = "studio-erp-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "tsc"

[env]
# Set these via wrangler secret put
# JWT_SECRET = ""
# ENCRYPTION_KEY = ""

[[d1_databases]]
binding = "DB"
database_name = "studio-erp"
database_id = "your-database-id-here"

[[r2_buckets]]
binding = "R2"
bucket_name = "studio-erp-assets"

[vars]
ENVIRONMENT = "development"